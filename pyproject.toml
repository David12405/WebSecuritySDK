[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "websecuritycheck"
version = "0.1.0"
description = "A typed SDK for agentic web-security checks, built on Strands Agents."
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.58",
    "mcp>=2.1",
    "httpx>=0.28",
    "cryptography>=46",
    "pydantic>=2.11",
    "pyyaml>=6",
]

[project.optional-dependencies]
# The OpenAI provider. Bedrock needs nothing extra; engine/models.py imports
# the OpenAI SDK only when a model string names it.
openai = ["openai>=1.0"]
# The explore_browser L6 tool drives a real Chromium through Playwright.
# After installing, run `playwright install chromium` for the browser itself.
browser = ["playwright>=1.40"]
# Everything optional at once.
all = ["openai>=1.0", "playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/websecuritycheck"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests"]
markers = [
    "live_tools: opt-in tests against an authorized lab target",
    "live_nmap: isolated opt-in Nmap tests against an authorized lab target",
    "live_agent: opt-in tests requiring an Agent model and credentials",
]

[tool.ruff]
line-length = 100
src = ["src", "mcp_servers", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# `_builders` is the test suite's own helper module, not a dependency.
known-first-party = ["websecuritycheck", "mcp_servers", "_builders"]
